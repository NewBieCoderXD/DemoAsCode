name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  APP_NAME: demo-as-code-postprocess
  ENGINE_DIR: apps/engine/
  POSTPROCESSOR_DIR: apps/engine/post-processor
  DIST_POSTPROCESSOR_DIR: apps/engine/dist/postprocessing
  CARGO_INCREMENTAL: 1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./apps/engine/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version match: $PKG_VERSION"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: pnpm exec napi build --platform --release --esm -o ../dist/postprocessing --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: pnpm exec napi build --platform --release --esm -o ../dist/postprocessing --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: pnpm exec napi build --platform --release --esm -o ../dist/postprocessing --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: pnpm exec napi build --platform --release --esm -o ../dist/postprocessing --target x86_64-unknown-linux-musl -x
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            shell: bash
            build: pnpm exec napi build --platform --release --esm -o ../dist/postprocessing --target x86_64-pc-windows-msvc

    name: stable - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Ensure Rust target is installed
        run: rustup target add ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.settings.target }}

      - name: Install zig (musl builds)
        if: contains(matrix.settings.target, 'musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1

      - name: Install cargo-zigbuild (musl builds)
        if: contains(matrix.settings.target, 'musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ${{ env.POSTPROCESSOR_DIR }}
        shell: bash
        run: ${{ matrix.settings.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.DIST_POSTPROCESSOR_DIR }}/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: napi-wrappers
          path: |
            ${{ env.DIST_POSTPROCESSOR_DIR }}/index.js
            ${{ env.DIST_POSTPROCESSOR_DIR }}/index.d.ts
          if-no-files-found: error
          overwrite: true

  publish:
    needs: build
    environment: npm-production
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Copy readme
        run: cp README.md apps/engine/

      - name: Create npm dirs
        run: cd ${{ env.ENGINE_DIR }} && pnpm exec napi create-npm-dirs

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.ENGINE_DIR }}/artifacts

      - name: Move artifacts
        run: cd ${{ env.ENGINE_DIR }} && pnpm exec napi artifacts

      - name: List packages
        run: ls -la ${{ env.ENGINE_DIR }}/npm && find ${{ env.ENGINE_DIR }}/npm -name "*.node" -o -name "package.json" | head -20

      - name: Restore generated binding wrappers
        run: |
          mkdir -p apps/engine/dist/postprocessing/
          cp ${{ env.ENGINE_DIR }}/artifacts/napi-wrappers/* apps/engine/dist/postprocessing/

      - name: Build TypeScript
        run: pnpm --filter demo-as-code run ts:build

      - name: Prepare for prepublish
        run: cd ${{ env.ENGINE_DIR }} && pnpm exec napi prepublish -t npm --skip-optional-publish

      - name: Publish platform packages
        run: |
          for dir in ${{ env.ENGINE_DIR }}/npm/*/; do
            if [ -f "$dir/package.json" ]; then
              echo "Publishing $dir..."
              (cd "$dir" && pnpm stage publish --access public --no-git-checks)
            fi
          done

      - name: Publish engine package
        run: pnpm --filter demo-as-code stage publish --access public --no-git-checks
